name = "AI日报质检与提醒"
prompt = "每日 AI 资讯日报：质检 + 润色 + 发布提醒。\n\n## 执行边界（务必遵守）\n- 采集与生成一律由云端 GitHub Actions 完成：仓库 shirleybbbin-bot/ai-daily-news，workflow daily.yml，cron `30 23 * * *`（UTC 23:30 = 北京时间 07:30）。本心跳 08:00 触发，正常情况下云端已跑完并把产物 commit 到 data/。\n- 本地沙箱只读且禁网：不能联网采集、不能 pip install、不能 git push。本地只做「校验产物 → 离线润色 → 汇报提醒」。\n- 不要调用 request_permissions（该工具不存在）。不要本地跑 build_daily.py 采集。不要 git push。不要用旧数据顶替当天日报，严禁编造当日新闻。\n- 本地可写目录仅 /Users/binjiali/Documents/Codex/2026-09-03/bang 与 /private/tmp；~/.codex/ 只读。\n- 所有命令都在 /Users/binjiali/Documents/Codex/2026-09-03/bang/ai-daily-news 下执行，Python 用 ./.venv/bin/python。\n\n## 数据结构（data/today_data.json）\n顶层是**数组**，每个元素一条新闻，没有顶层 date 字段。常用键：\n- 原文：`title` / `summary` / `url` / `source` / `source_domain` / `pub_date` / `lang` / `is_paper`\n- 中文稿（润色对象）：`cn_title` / `cn_summary` / `tags`\n- 分级排序：`category` / `signal_grade` / `_score`\n- 其他：`image_url`（原文 og:image）/ `fact_check` / `llm_fallback` / `editor_note`（前 5 条洞察，模板 src/templates/daily_report.html:117 渲染成「洞察：」）/ `sources` + `source_count`（多源合并）\n\n## 1. 确认云端产物到位\ntoday=$(date +%F)\n判定「是今天的稿」：data/ai-daily-$today.html 存在，且 data/today_data.json 的 mtime 是今天。\n- 若不满足：云端失败或产物没取回本地。直接汇报，并给出需要用户自己执行的命令：\n    cd /Users/binjiali/Documents/Codex/2026-09-03/bang/ai-daily-news && git pull origin main\n    gh run list --repo shirleybbbin-bot/ai-daily-news --workflow daily.yml --limit 3\n    gh run view <run_id> --repo shirleybbbin-bot/ai-daily-news --log-failed\n  并解释退出码：exit 2 = LLM 端点探活失败（查 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL secrets；可跑 gh workflow run daily.yml --repo shirleybbbin-bot/ai-daily-news -f llm_probe_only=true 做约 30 秒诊断）；exit 3 = LLM 降级率超过 quality_control.max_llm_fallback_rate（0.3），大量条目用的是原文兜底摘要，必须人工复核。\n  本轮到此结束并以 NOTIFY 收尾，不要继续第 2-4 步。\n\n## 2. 跑离线质检（不要自己临时写统计脚本）\n./.venv/bin/python qc_daily.py data/today_data.json --date $today --json\n它会逐项判定并给出 ❌（硬伤，退出码 1）与 ⚠️（提示）：条目数、摘要 90-160 字、重复标题/链接、英文标题未中文化、标签数、来源多样性与单源上限、分类覆盖、配图率≥50%、时效性（pub_date 是否落在 36h 内，专治拿旧数据当今天日报）、AIbase 前 5、前 5 条 editor_note、反 AI 腔套话与「该X」书面指代、LLM 降级率、登录页脏条目；同时列出 fact_check 标记项。\n把 JSON_RESULT 里的结论逐条搬进汇报，不达标要写明现状与差距。\n\n## 3. 你自己做润色与一致性校对（不调外部 API）\n先跑机械修正（自动备份 today_data.json.bak-$today）：\n./.venv/bin/python qc_daily.py data/today_data.json --date $today --fix-trace\n再逐条人工改 cn_title / cn_summary / tags / editor_note，写回 data/today_data.json：\n- 反 AI 腔：此举旨在／标志着／被视为／引发业界／值得关注的是／据悉／值得一提的是／具有重要意义／赋能／助力／打造／引领／重塑，一律改成具体说法\n- 一致性自检：cn_summary 与原文 summary 比对，数字／公司名／产品名必须一致；发现「加戏」（中文摘要出现原文没有的信息）或「歪曲」（原文说 A 摘要写 B）直接改正\n- 摘要统一 90-160 字；lang=en 与 is_paper 的条目 cn_title 必须是中文；每条 tags 2-3 个\n- 按 _score 与 signal_grade 给前 5 条补 editor_note：写编辑判断（对读者意味着什么、下一步该盯什么），不要复述摘要\n改完重跑第 2 步的 qc_daily.py 确认 ❌ 清零。\n\n## 4. 重新生成 HTML\n./.venv/bin/python gen_daily.py data/today_data.json --date $today\n（脚本自己会把仓库根与 src 加进 sys.path，无需 PYTHONPATH；不要加 --extract-images，它会清掉已抓好的 image_url 且需要联网）\n产物：data/ai-daily-$today.html。生成后确认 HTML 能解析、卡片数与 JSON 条目数一致、前 5 条洞察块已渲染。\n禁止运行 test_mock_data.py（它会覆盖已入库的 data/ai-daily-2026-09-03.html）。\n本地改动不要 git push；把「需用户执行 git add/commit/push 才能同步云端」写进汇报。\n\n## 5. 汇报\n- HTML 绝对路径（可点击）\n- 5 条今日要点速览\n- 质量门槛逐项通过情况（不达标写明差距）\n- fact_check 标记项与 llm_fallback 条目清单\n- 提醒用户 8:30 前审核后发布到公众号「AI洞察局」，并尽早转发企业微信「大装置」群与 ai 洞察局小助手各群\n- 需要用户动手（云端失败／门槛不达标／需 push 同步）→ NOTIFY；一切正常且只做了润色 → DONT_NOTIFY"
