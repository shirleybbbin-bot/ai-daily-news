# --- 网页抓取源 (无 RSS 的站点) ---
web_sources:
  - name: AIbase 头条
    url: https://news.aibase.com/zh/news
    category: 行业动态
    lang: zh
    weight: 1.5
    selector: ".news-item"
    title_selector: ".news-title"
    link_selector: "a"
    summary_selector: ".news-summary"
    required: true  # 必须包含关注度前5

  - name: AIbase 每日精选
    url: https://www.aibase.com/zh/daily
    category: 行业动态
    lang: zh
    weight: 1.3

  - name: AIHOT精选
    url: https://aihot.virxact.com
    category: 行业动态
    lang: zh
    weight: 1.1

  - name: 1AI快讯
    url: https://www.1ai.net/newsflashes
    category: 行业动态
    lang: zh
    weight: 0.9

  - name: 24小时AI快讯
    url: https://maomu.com/news
    category: 行业动态
    lang: zh
    weight: 0.9

  - name: 36氪AI板块
    url: https://36kr.com/information/technology/
    category: 行业动态
    lang: zh
    weight: 1.0
    keyword_filter: "AI,人工智能,大模型,LLM,GPT,OpenAI,智能,算法"

  - name: IT桔子创投
