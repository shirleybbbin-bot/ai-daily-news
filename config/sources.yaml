    lang: zh
    weight: 0.8
    keyword_filter: "AI,人工智能,大模型,智能"

# --- Hacker News (API) ---
hackernews:
  enabled: true
  top_n: 20
  keyword_filter: "AI,ML,LLM,GPT,OpenAI,Anthropic,CLIP,diffusion,transformer,model,neural,deep learning,machine learning,AGI,agent,RAG,embedding,fine-tune,vision,language model"
  min_score: 50
  category: 大V观点

# --- arXiv 论文 ---
arxiv:
  enabled: true
  categories: ["cs.AI", "cs.CL", "cs.LG"]
  max_papers: 10
  sort_by: "relevance"
  keyword_boost: "LLM,GPT,reasoning,agent,multimodal,diffusion,RLHF,instruction,fine-tuning,retrieval,vision-language,tool use,code generation"
  category_tag: "论文精选"

# --- GitHub Trending (开源热榜) ---
github_trending:
  enabled: true
  max_items: 8
  since: "daily"  # daily, weekly, monthly
  languages: ["python", "jupyter-notebook"]
  keyword_filter: "AI,ML,LLM,GPT,transformer,diffusion,neural,agent,RAG,vision-language,machine learning,deep learning,large language model,fine-tune,embedding,CLIP,stable diffusion,langchain,autonomous,reasoning"
  category_tag: "开源热榜"
