# ============================================================
# 全局设置
# ============================================================

pipeline:
  lookback_hours: 24
  max_items: 35
  min_items: 25
  summary_min_chars: 90
  summary_max_chars: 160
  title_max_chars: 20
  tags_per_item: 3
  dedup_similarity_threshold: 0.65

llm:
  provider: zhipu
  model: glm-5.2
  temperature: 0.3
  max_tokens: 4096
  # OpenAI-compatible endpoint
  base_url: https://open.bigmodel.cn/api/paas/v4

# 前 N 条重点新闻由 LLM 写"编辑判断"，模板渲染成卡片里的「洞察：」块
editor_note:
  top_n: 5

# 校准/质检规则
quality_control:
  require_source_diversity: true   # 来源至少覆盖 4 个不同站点
  require_aibase_top5: true       # 必须包含 AIbase 关注度前5
  min_sources: 4
  check_summary_length: true
  check_no_duplicates: true
  check_no_english_titles: true   # 英文标题必须中文化
  check_tags_count: true
  max_items_per_source: 5         # 单一来源最多5条
  # 以下门槛供 qc_daily.py / print_report 使用（❌ 才算不通过，⚠️ 只提示）
  min_image_ratio: 0.5            # 配图率下限，图片取原文 og:image
  max_item_age_hours: 36          # pub_date 超过此小时数视为过期（拦住拿旧数据当今天日报）
  min_fresh_ratio: 0.6            # 时效窗口内条目占比下限
  min_aibase_items: 5             # AIbase 关注度前5 是硬要求
  required_categories:            # 缺项只告警，但要在汇报里写明
    - headline
    - investment
    - policy
    - technology
    - product
    - bigtech
    - paper
    - opensource
  check_editor_notes: true        # 前 editor_note.top_n 条要有编辑判断
  check_anti_cliche: true         # 反 AI 腔套话硬校验
  # LLM 静默降级闸门：走"原文摘要兜底"的条目占比超过此值即判定不可交付，
  # 在生成 HTML / 发布之前退出（exit 3），让 CI 变红而不是悄悄发一版废稿。
  # 兜底条目的特征：标题没中文化、tags 为空。加 --allow-llm-failure 可强制出稿。
  max_llm_fallback_rate: 0.3

output:
  dir: data
  filename_pattern: "ai-daily-{date}.html"
  json_filename_pattern: "today_data.json"
  template: src/templates/daily_report.html

wechat:
  enabled: false
  author: "AI洞察局"
  # 封面图由 AI 生成或使用默认图
  default_cover_url: ""

# 图片提取配置
image_extraction:
  enabled: true
  validate_urls: true            # 验证图片URL可访问性 (HEAD请求)
  max_fetches: 60                # 最多抓取的页面数
  min_file_size: 2048            # 最小文件大小(字节)，过滤追踪像素
  min_width: 200                 # 最小图片宽度
  min_height: 150                # 最小图片高度
  rate_limit_ms: 300             # 每次抓取间隔(毫秒)
  strategies:                    # 策略优先级 (从上到下)
    - rss_summary                # RSS摘要内嵌图片
    - newspaper3k                # newspaper3k top_image
    - trafilatura                # trafilatura 提取+元数据
    - jsonld                     # JSON-LD 结构化数据
    - og_image                   # og:image/twitter:image meta
    - body_image                 # 正文首张图片 (含懒加载)
  fallback_image_url: ""         # 无图时的占位图URL (留空则不显示图片)

# 多重事实校对配置
fact_check:
  enabled: true                   # 启用事实校对
  lookback_hours: 48              # 时效性：发布时间窗口(小时)
  check_url_accessible: true      # 真实性：源URL可达性
  check_entity_match: true        # 真实性：关键实体在原文出现
  check_numbers: true             # 准确性：关键数字在原文溯源
  check_timeliness: true          # 时效性：发布日期校验

# 一致性自检后的处理
coherence:
  drop_fail: true                 # 出稿前自动剔除 verdict=fail 的条目（改不回来的"加戏"）
  min_keep: 25                    # 剔除后不得低于此条数，否则按分数回补 fail 条目标注待核

# 原文正文补全（放在 process_and_summarize 之前）
# 不少源 RSS 摘要极短（实测 InfoQ 中位 7 字、量子位 17 字、HN 28 字），
# LLM 拿空壳原文只能凭标题脑补 → 一致性自检 fail。
# 这里先用 trafilatura 抓正文补上，补不到的才丢弃。
source_text:
  enabled: true
  min_chars: 50                   # 低于此长度视为原文不足
  max_workers: 8                  # 并发抓取数
  timeout: 20                     # 单页抓取超时(秒)
  max_chars: 2500                 # 正文截断长度
